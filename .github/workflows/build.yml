name: Build Android APK
on: [push]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Decodificar Keystore (Blindado)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p ~/.android
          # Limpiamos saltos de línea y espacios del secreto para evitar errores
          echo "$KEYSTORE_BASE64" | tr -d '\n\r ' | base64 -d > ~/.android/release.keystore
          
          # Verificamos que el archivo no esté vacío
          if [ ! -s ~/.android/release.keystore ]; then
            echo "⚠️ ERROR: El archivo keystore se decodificó vacío. Revisa tu secreto BASE64."
            exit 1
          fi
          echo "✅ Keystore decodificado correctamente."

      - name: Instalar Godot y exportar APK
        uses: abarichello/godot-ci@master
        with:
          godot-version: '4.7.2'
          export-preset: 'Android'
        env:
          # Le decimos a Godot exactamente dónde está el keystore y sus credenciales
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: /home/runner/.android/release.keystore
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: ${{ secrets.ANDROID_KEYSTORE_USER }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}

      - name: Subir APK como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: mi-pong-apk
          path: build/game.apk
