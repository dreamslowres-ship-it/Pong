name: Build Android APK
on: [push]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 🔥 1. Descargar e instalar Godot 4.7.2 y sus plantillas
      - name: Instalar Godot y Plantillas de Exportación
        run: |
          echo "Descargando Godot 4.7.2..."
          wget -q https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          wget -q https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          
          echo "Instalando el editor de Godot..."
          unzip -q Godot_v4.7.2-stable_linux.x86_64.zip
          sudo mv Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot
          
          echo "Instalando las plantillas de exportación..."
          # Creamos la carpeta exacta donde Godot 4.7 busca las plantillas
          mkdir -p ~/.local/share/godot/export_templates/4.7.2.stable
          unzip -q Godot_v4.7.2-stable_export_templates.tpz
          mv templates/* ~/.local/share/godot/export_templates/4.7.2.stable/

      # 🔥 2. Configurar el Keystore y las credenciales
      - name: Configurar Keystore y Credenciales
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_USER: ${{ secrets.ANDROID_KEYSTORE_USER }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          mkdir -p /home/runner/.android
          echo "$KEYSTORE_BASE64" | tr -d '\n\r ' | base64 -d > /home/runner/.android/release.keystore
          
          if ! grep -q "keystore/release=" export_presets.cfg; then
            echo 'keystore/release=""' >> export_presets.cfg
            echo 'keystore/release_user=""' >> export_presets.cfg
            echo 'keystore/release_password=""' >> export_presets.cfg
          fi
          
          sed -i "s|keystore/release=\".*\"|keystore/release=\"/home/runner/.android/release.keystore\"|g" export_presets.cfg
          sed -i "s|keystore/release_user=\".*\"|keystore/release_user=\"$KEYSTORE_USER\"|g" export_presets.cfg
          sed -i "s|keystore/release_password=\".*\"|keystore/release_password=\"$KEYSTORE_PASSWORD\"|g" export_presets.cfg

      # 🔥 3. Decirle a Godot dónde está el SDK de Android (ya viene preinstalado en ubuntu-latest)
      - name: Configurar Ajustes del Editor
        run: |
          mkdir -p ~/.config/godot
          cat <<EOF > ~/.config/godot/editor_settings-4.tres
          [gd_resource type="EditorSettings" format=2]
          
          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "/usr/local/lib/android/sdk"
          EOF

      # 🔥 4. Exportar el APK
      - name: Exportar APK
        run: |
          mkdir -p build
          godot --headless --export-release "Android" build/game.apk

      - name: Subir APK como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: mi-pong-apk
          path: build/game.apk
          if-no-files-found: error
