name: Build Android APK
on: [push]

jobs:
  build-android:
    runs-on: ubuntu-latest
    container:
      # 🔥 Usamos la imagen oficial que ya tiene Godot 4.7.2, Java y el SDK listos
      image: barichello/godot-ci:4.7.2-stable
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configurar Keystore y Credenciales
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_USER: ${{ secrets.ANDROID_KEYSTORE_USER }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          # 1. Decodificamos el keystore en una ruta absoluta
          mkdir -p /root/.android
          echo "$KEYSTORE_BASE64" | tr -d '\n\r ' | base64 -d > /root/.android/release.keystore
          
          # 2. Aseguramos que las líneas del keystore existan en el archivo de exportación
          if ! grep -q "keystore/release=" export_presets.cfg; then
            echo 'keystore/release=""' >> export_presets.cfg
            echo 'keystore/release_user=""' >> export_presets.cfg
            echo 'keystore/release_password=""' >> export_presets.cfg
          fi
          
          # 3. Inyectamos las credenciales reales
          sed -i "s|keystore/release=\".*\"|keystore/release=\"/root/.android/release.keystore\"|g" export_presets.cfg
          sed -i "s|keystore/release_user=\".*\"|keystore/release_user=\"$KEYSTORE_USER\"|g" export_presets.cfg
          sed -i "s|keystore/release_password=\".*\"|keystore/release_password=\"$KEYSTORE_PASSWORD\"|g" export_presets.cfg

      - name: Exportar APK
        # 🔥 Usamos el comando oficial que ya sabe dónde está todo
        run: |
          mkdir -p build
          godot --headless --export-release "Android" build/game.apk

      - name: Subir APK como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: mi-pong-apk
          path: build/game.apk
          if-no-files-found: error
