name: Build Android APK
on: [push]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Decodificar Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p ~/.android
          echo "$KEYSTORE_BASE64" | base64 --decode > ~/.android/release.keystore

      - name: Instalar Godot y exportar APK
        uses: abarichello/godot-ci@master
        with:
          godot-version: '4.7.2'
          export-preset: 'Android'
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: /home/runner/.android/release.keystore
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: ${{ secrets.ANDROID_KEYSTORE_USER }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}

      - name: Subir APK como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: mi-pong-apk
          path: build/game.apk

