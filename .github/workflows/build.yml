name: Build Android APK
on: [push]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Exportar APK con Godot 4.7.2
        uses: appsinacup/action_export_godot_game@master
        with:
          godot-version: '4.7.2-stable'
          game-name: 'Pong v1.0.0'
          platform-name: 'Android'
          android-package: 'com.dreamslowres.pong'
          
          # 🔥 Secretos de tu Keystore
          secret-android-keystore-base64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          secret-android-keystore-user: ${{ secrets.ANDROID_KEYSTORE_USER }}
          secret-android-keystore-password: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}

      - name: Subir APK como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: mi-pong-apk
          path: build/*.apk
          if-no-files-found: error
